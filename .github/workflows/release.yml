name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 Static (musl)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: sltop-linux-amd64
            use_cross: true

          # Linux ARM64 Static (musl)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: sltop-linux-arm64
            use_cross: true

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sltop-darwin-arm64
            use_cross: false

          # macOS Intel (Cross-compiled natively on macOS runner)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sltop-darwin-amd64
            use_cross: false

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sltop-windows-amd64
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build target
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Archive Unix binary
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sltop dist/sltop
          cp README.md dist/
          cp LICENSE dist/
          cd dist
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz sltop README.md LICENSE

      - name: Archive Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/sltop.exe -Destination dist/sltop.exe
          Copy-Item README.md -Destination dist/README.md
          Copy-Item LICENSE -Destination dist/LICENSE
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip

  build-packages:
    name: Build .deb & .rpm Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo packaging tools
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build native binary and packages
        run: |
          cargo build --release
          cargo deb --no-build -o sltop-amd64.deb
          cargo generate-rpm -o sltop-amd64.rpm

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist-packages
          path: |
            *.deb
            *.rpm

  create-release:
    name: Publish GitHub Release
    needs: [build-binaries, build-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute SHA256 checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
